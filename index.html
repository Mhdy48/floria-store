<!doctype html>

          <article

                src="assets/image/categories/hanging-plants.webp"

            <div

              <h2 class="font-medium text-[1rem] md:text-xl lg:text-2xl">

            >
              <img
                class="w-[85%]"
                src="assets/image/categories/air-plants.webp"
                alt="گیاهان هوایی"
              />
            </div>

            <div
              class="flex flex-col justify-center items-center basis-[60%] gap-1"
            >
              <h2 class="font-medium text-[1rem] md:text-xl lg:text-2xl">
                گیاهان هوایی
              </h2>

              <p class="text-[.6rem] md:text-[.7rem] lg:text-[.8rem]">

              </p>

              <a class="text-[.6rem] md:text-[.7rem] lg:text-xs" href="#">

              </a>

            class="bg-[#121f1a] p-3 flex flex-col justify-evenly items-center col-start-1 col-end-7 row-start-2 row-end-3 rounded-xl md:col-start-3 md:col-end-5 md:row-start-1 md:row-end-3 lg:col-start-5 lg:col-end-7 lg:row-start-1 lg:row-end-3"

            <div>

                کدام گیاه
                <br />

                <br />

              </h2>

            <div
              class="bg-[#fff5e6] p-2 flex justify-evenly items-center rounded-xl gap-1"

              <img
                class="w-4 aspect-square lg:w-5"

              </a>

              <a class="text-[.6rem] md:text-[.7rem] lg:text-xs" href="#">

              </a>

            <div class="flex justify-center items-center">

              />

        <!-- ==================== Products Section ==================== -->
        <section></section>

        <section></section>
