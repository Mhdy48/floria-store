<!doctype html>

  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ==================== Page Information ==================== -->

    <!-- ==================== Favicon ==================== -->
    <link rel="shortcut icon" href="" type="image/x-icon" />

    <!-- ==================== Stylesheets ==================== -->
    <link rel="stylesheet" href="style.css" />

  <body>
    <div class="container-web">
      <!-- ==================== Top Bar ==================== -->
      <div></div>

      <!-- ==================== Header ==================== -->

      <!-- ==================== Main Content ==================== -->
      <main>
        <!-- ==================== Hero Section ==================== -->
        <section></section>

        <!-- ==================== Categories Section ==================== -->
        <section
          class="grid grid-cols-6 grid-rows-3 gap-3 p-5 md:grid-rows-2 md:p-7 lg:grid-cols-12 lg:grid-rows-2 lg:p-10"
        >
          <!-- Hanging Plants Card -->
          <article
            class="col-start-1 col-end-4 row-start-3 row-end-4 flex flex-col items-center rounded-xl bg-[#f0e9e1] p-3 md:col-start-1 md:col-end-4 md:row-start-auto md:row-end-auto md:flex-row lg:col-start-1 lg:col-end-5 lg:row-start-auto lg:row-end-auto"
          >
            <div
              class="order-2 flex h-25 w-30 basis-[40%] items-center justify-center md:order-0 md:h-auto md:w-auto"
            >
              <img
                src="assets/image/categories/hanging-plants.webp"
                alt="گیاهان آویز"
              />
            </div>

            <div
              class="flex basis-[60%] flex-col items-center justify-center gap-1"
            >
              <h2 class="text-[1rem] font-medium md:text-xl lg:text-2xl">
                گیاهان آویز
              </h2>

              <p class="text-[.6rem] md:text-[.7rem] lg:text-[.8rem]">

              </p>

              <a class="text-[.6rem] md:text-[.7rem] lg:text-xs" href="#">
                مشاهده ←
              </a>
            </div>
          </article>

          <!-- Air Plants Card -->
          <article
            class="col-start-4 col-end-7 row-start-3 row-end-4 flex flex-col items-center rounded-xl bg-[#f0e9e1] p-3 md:col-start-4 md:col-end-7 md:row-start-auto md:row-end-auto md:flex-row lg:col-start-1 lg:col-end-5 lg:row-start-2 lg:row-end-3"

            <div
              class="order-2 flex h-30 w-35 basis-[40%] items-center justify-center md:order-0 md:h-auto md:w-auto"
            >
              <img
                class="w-[85%]"
                src="assets/image/categories/air-plants.webp"
                alt="گیاهان هوایی"
              />
            </div>

            <div
              class="flex basis-[60%] flex-col items-center justify-center gap-1"
            >
              <h2 class="text-[1rem] font-medium md:text-xl lg:text-2xl">
                گیاهان هوایی
              </h2>

              <p class="text-[.6rem] md:text-[.7rem] lg:text-[.8rem]">
                بدون خاک، بدون دردسر
              </p>

              <a class="text-[.6rem] md:text-[.7rem] lg:text-xs" href="#">
                مشاهده ←
              </a>
            </div>
          </article>

          <!-- Plant Guide Card -->
          <article
            class="col-start-1 col-end-7 row-start-2 row-end-3 flex flex-col items-center justify-evenly rounded-xl bg-[#121f1a] p-3 md:col-start-3 md:col-end-5 md:row-start-1 md:row-end-3 lg:col-start-5 lg:col-end-7 lg:row-start-1 lg:row-end-3"
          >
            <div>
              <h2
                class="text-center text-xl font-light text-white md:text-xl lg:text-2xl"
              >
                کدام گیاه
                <br />
                برای شما
                <br />
                مناسب است؟
              </h2>
            </div>

            <div
              class="flex items-center justify-evenly gap-1 rounded-xl bg-[#f0e9e1] p-2"
            >
              <img
                class="aspect-square w-4 lg:w-5"
                src="assets/image/categories/leaves.png"
                alt=""
              />

              <a class="text-[10px] font-medium lg:text-xs" href="#">
                راهنمای انتخاب ←
              </a>
            </div>
          </article>

          <!-- Cactus & Succulents Card -->
          <article
            class="col-start-1 col-end-4 row-start-1 row-end-2 flex flex-col items-center justify-evenly rounded-xl bg-[#f0e9e1] p-3 md:col-start-1 md:col-end-3 md:row-start-1 md:row-end-3 lg:col-start-7 lg:col-end-10 lg:row-start-1 lg:row-end-3"
          >
            <div class="flex flex-col items-center gap-1">
              <h2
                class="text-[1rem] font-medium whitespace-nowrap md:text-xl lg:text-2xl"

                ساکولنت و کاکتوس

            <div class="flex items-center justify-center">

                class="h-25 w-30 md:h-30 md:w-35 lg:h-45 lg:w-50"

              />

            class="col-start-4 col-end-7 row-start-1 row-end-2 flex flex-col items-center justify-evenly rounded-xl bg-[#f0e9e1] p-3 md:col-start-5 md:col-end-7 md:row-start-1 md:row-end-3 lg:col-start-10 lg:col-end-13 lg:row-start-1 lg:row-end-3"

              </h2>

              <p class="text-[.6rem] md:text-[.7rem] lg:text-[.8rem]">
                زیبایی و ماندگاری در خانه
              </p>

              <a class="text-[.6rem] md:text-[.7rem] lg:text-xs" href="#">
                مشاهده ←
              </a>
            </div>

            <div class="flex items-center justify-center">
              <img
                class="h-23 w-25 md:h-28 md:w-30 lg:h-45 lg:w-40"
                src="assets/image/categories/indoor-plants.webp"
                alt="گیاه آپارتمانی"
              />
            </div>
          </article>

        <!-- ==================== Popular Products Section ==================== -->
        <section></section>

        <!-- ==================== Promotional Banner Section ==================== -->
        <section></section>

        <!-- ==================== Products Section ==================== -->
        <section></section>

        <!-- ==================== Care Articles Section ==================== -->
        <section></section>
