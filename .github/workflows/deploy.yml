name: Deploy to GitHub Pages

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Tailwind CSS
        run: npx @tailwindcss/cli -i ./src/input.css -o ./src/output.css

      - name: Create deployment folder
        run: |
          rm -rf deploy
          mkdir -p deploy/src/js
          cp index.html deploy/
          cp style.css deploy/
          cp -r assets deploy/
          cp -r pages deploy/
          cp src/output.css deploy/src/
          cp src/input.css deploy/src/
          cp -r src/js/. deploy/src/js/

          # index.html lives at the deployment root, so its JS path must be root-relative.
          sed -i 's#src="../src/js/main.js"#src="./src/js/main.js"#g' deploy/index.html

      - name: Verify deployment files
        run: |
          test -f deploy/src/js/main.js
          test -f deploy/src/js/navbar.js
          test -f deploy/src/js/mobileMenu.js
          test -f deploy/src/js/backToTop.js
          test -f deploy/src/js/careAccordion.js
          test -f deploy/src/js/dealsSlider.js
          test -f deploy/src/js/saleCountdown.js
          grep -q 'src="./src/js/main.js"' deploy/index.html
          echo "JavaScript files and root index path verified successfully."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
